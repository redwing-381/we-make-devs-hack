[project]
name = "whygraph"
version = "0.1.0"
description = "Multi-agent incident investigation and memory on FalkorDB: every conclusion is a graph path."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "falkordb>=1.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "anthropic>=0.60",
    "voyageai>=0.3.7",
    "fastmcp>=2.10",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whygraph"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a running FalkorDB (skipped if unreachable, unless REQUIRE_FALKORDB=1)",
]
